## 15. What remains uncertain

| Uncertainty | What it means for you |
|---|---|
| Short, small trials | Most evidence comes from 6–12-week trials with 10–20 people per group, often untrained young men, so small, slow or individual effects are hard to detect |
| Outcomes are not appearance | Trials measure thickness, cross-sectional area or lean mass in a few muscles; how you look also depends on fat distribution, proportions and preference |
| Swelling confounds early measurements | Early size increases are partly oedema (Damas 2016a), which can exaggerate short-term growth in trials and in your own tape measurements |
| RIR is self-reported | Trials of proximity to failure rely on estimated RIR, which people misjudge (Halperin 2022); your own effort targets carry the same error |
| Long-length training | The evidence covers a few muscles (hamstrings, triceps, quadriceps, calves and glutes) in small trials and may not apply to every muscle |
| Cardio interference | Results vary with modality, dose, timing and training status; fibre-level data suggest some interference that whole-muscle measures miss (Lundberg 2022) |
| Energy balance for beginners | How much a calorie surplus speeds muscle gain in true beginners, compared with maintenance, has not been well quantified; Helms 2023 studied trained lifters |
| Individual variation | Responses vary widely (Hubal 2005); treat this program as a hypothesis about what will work for you, test it against your own data, and adjust it with the decision rules in 12.3 |

// ---------- set logging ----------
function exCtx(el) {
  const ex = el.closest('.ex'); const row = el.closest('.set');
  const w = +ex.dataset.w, sid = ex.dataset.sid, rk = ex.dataset.row; const r = ROW_BY_KEY[rk]; const v = rowView(r);
  return { ex, row, w, sid, rk, r, v, i: row ? +row.dataset.i : -1 };
}

}
function onSetInput(inp) {

  const c = exCtx(inp); const e = ensureEx(c);

}
function onTick(btn) {

    for (const inp of $$('input.si', c.row)) {
      const f = inp.dataset.f;

        else if (f === 'reps') { inp.focus(); toast('Enter the ' + (c.v.fields === 'time' ? 'seconds' : c.v.fields === 'carry' ? 'metres' : 'reps') + ' you did'); return; }
      } else s[f] = num(inp.value);
    }
  }

}

  const e = exLog(c.w, c.sid, c.rk) || { sets: [] };
  c.ex.classList.toggle('done', e.sets.slice(0, n).filter((x) => x && x.done).length >= n);
}
function isDone(w, sid, rk, j) { const e = exLog(w, sid, rk); return !!(e && e.sets[j] && e.sets[j].done); }
function nextSet(w, sid, idx, i) {
  const rows = SESS[sid].rows; const counts = rowCounts(w, sid); const r = rows[idx];
  if (r.sup === 'b') { const a = rows[idx - 1]; if (a && a.sup === 'a' && i + 1 < counts[idx - 1].n && !isDone(w, sid, a.key, i + 1)) return { k: idx - 1, j: i + 1 }; }
  for (let k = idx; k < rows.length; k++) {
    for (let j = k === idx ? i + 1 : 0; j < counts[k].n; j++) if (!isDone(w, sid, rows[k].key, j)) return { k, j };
  }
  for (let k = 0; k < idx; k++) for (let j = 0; j < counts[k].n; j++) if (!rows[k].optional && !isDone(w, sid, rows[k].key, j)) return { k, j };

}

  const rows = SESS[sid].rows; const counts = rowCounts(w, sid);
  return 'Next: ' + (n.k === idx ? 'set ' + (n.j + 1) + ' of ' + counts[n.k].n : rows[n.k].n + ', ' + rowView(rows[n.k]).name.toLowerCase());
}
function afterSet(c) {
  const rows = SESS[c.sid].rows; const idx = rows.indexOf(c.r); const counts = rowCounts(c.w, c.sid);
  if (c.r.go) {
    const pi = rows.findIndex((x) => x.n === c.r.go);

      startGo(rowView(rows[pi]).name + ', set ' + (c.i + 1) + ', with no rest. Rest after ' + c.r.go + '.', c.r.go, { targetId: 'ex-' + rows[pi].key.replace(':', '-'), setI: c.i, alt: c.r.key === 'UB:5a' });

}

    "  const req = e.request;",
    "  if (req.method !== 'GET' || req.mode !== 'navigate') return;",
    "  const u = new URL(req.url), p = new URL(PAGE);",
    "  const same = u.origin === p.origin && (u.pathname === p.pathname || (p.pathname.endsWith('/index.html') && u.pathname === p.pathname.slice(0, -10)));",
    "  if (!same) return;",
    "  const net = fetch(req).then(async (res) => { if (res.ok) { const c = await caches.open(CACHE); await c.put(PAGE, res.clone()); } return res; });",
    "  e.waitUntil(net.then(() => {}, () => {}));",

    S.meas.mobtests = S.meas.mobtests || {}; S.meas.mobtests[w] = v; save(); closeSheet(); toast('Mobility tests saved'); refresh();
  },
  check: (el) => { const w = +el.dataset.w, i = +el.dataset.i; const a = S.check[w] = S.check[w] || []; a[i] = !a[i]; save(); refresh(); },
  light: (el) => { const w = +el.dataset.w; if (S.light[w]) delete S.light[w]; else S.light[w] = true; save(); toast(S.light[w] ? 'Week ' + w + ' is now a lighter week' : 'Week ' + w + ' is back to the full plan'); refresh(); },
  'recov-a': (el) => {
    const w = +el.dataset.w, i = +el.dataset.i; const r = S.recov[w] = S.recov[w] || { answers: [null, null, null, null] };
    r.answers[i] = el.dataset.v === '1';
    r.pass = r.answers.every((x) => x != null) ? r.answers.every((x) => x === true) : null; r.t = Date.now();
    save(); refresh();
  },
  decide: (el) => { S.meas.decision = S.meas.decision === el.dataset.v ? null : el.dataset.v; save(); refresh(); },
  'timer-easy': (el) => {
    const w = +el.dataset.w, id = el.dataset.id; const it = cardioItem(w, id); if (!it) return;
    timerStart({ title: 'Easy cardio, week ' + w, ret: '#/c/' + w + '/' + id, done: { type: 'cardio', w, id, min: it.min, cta: 'Log ' + it.min + ' min as done' }, phases: [{ name: 'Easy cardio', dur: it.min * 60, kind: 'easy', cue: EASY_CUE }] });
  },
  'timer-int': (el) => {
    const w = +el.dataset.w; const ph = intervalPhases(w); const min = Math.round(ph.reduce((a, p) => a + p.dur, 0) / 60);
    timerStart({ title: 'Intervals, week ' + w, ret: '#/c/' + w + '/sat', done: { type: 'cardio', w, id: 'sat', min, cta: 'Log ' + min + ' min as done' }, phases: ph });
  },
  'timer-submax': (el) => {
    const w = +el.dataset.w;
    timerStart({ title: 'Submaximal test, week ' + w, ret: '#/c/' + w + '/' + el.dataset.id, done: { type: 'submax', w, cta: 'Enter heart rate' }, phases: [
      { name: 'Steady workload', dur: 480, kind: 'easy', cue: 'Same machine and settings as last time, at an easy effort. Keep it steady.' },
      { name: 'Note your heart rate', dur: 120, kind: 'easy', cue: 'Watch your heart rate over these last 2 minutes and note the average.' }] });
  },
  'timer-bench': (el) => {
    const w = +el.dataset.w, k = el.dataset.v; const b = BENCH[k]; if (!b || !b.timer) return;
    timerStart({ title: 'Benchmark, week ' + w, ret: '#/c/' + w + '/sat', done: { type: 'bench', w, test: k, cta: 'Enter result' }, phases: [{ name: k === 'cooper' ? '12-min run' : '20-min bike', dur: b.timer, kind: 'hard', cue: k === 'cooper' ? 'Run as far as you can. Note the distance in metres at the end.' : 'All-out but even. Note the average power at the end.' }] });
  },
  'tm-pause': () => { if (!TM || TM.finished) return; if (TM.paused != null) { TM.ends = Date.now() + TM.paused * 1000; TM.paused = null; } else TM.paused = Math.max(0, (TM.ends - Date.now()) / 1000); persistTM(); drawTimer(true); },
  'tm-skip': () => { if (!TM || TM.finished) return; TM.paused = null; TM.ends = Date.now(); tick(); drawTimer(true); },
  'tm-end': () => { if (TM && TM.finished) { ACT['tm-close'](); return; } confirmSheet('End the timer?', 'The timer stops here. You can still log the session from its page.', 'End timer', 'tm-close'); },
  'tm-close': () => { const ret = TM && TM.ret; TM = null; persistTM(); closeSheet(); go(ret || '#/today'); },
  'tm-log': () => {
    if (!TM) return; const d = TM.done, ret = TM.ret; TM = null; persistTM();
    if (!d) { go(ret || '#/today'); return; }
    if (d.type === 'cardio') { S.cardio[d.w + ':' + d.id] = { done: true, min: d.min, t: Date.now() }; save(); toast('Logged'); go(ret); }
    else if (d.type === 'submax') { go(ret); setTimeout(() => measureSheet('submax', d.w), 120); }
    else if (d.type === 'bench') { S.bench = d.test; save(); go(ret); setTimeout(() => { const i = $('#bench-v'); if (i) i.focus(); }, 150); }
  },
  'cardio-log': (el) => {
    const w = +el.dataset.w, id = el.dataset.id; const inp = $('#cm'); const m = num(inp.value) != null ? num(inp.value) : num(inp.placeholder);
    S.cardio[w + ':' + id] = { done: true, min: m, t: Date.now() }; save(); toast('Logged'); refresh();
  },
  'cardio-unlog': (el) => { delete S.cardio[+el.dataset.w + ':' + el.dataset.id]; save(); toast('Marked as not done'); refresh(); },
  'bench-test': (el) => { S.bench = el.dataset.v; save(); refresh(); },
  'bench-save': (el) => {
    const w = +el.dataset.w, k = el.dataset.v; const raw = $('#bench-v').value.trim(); let val;
    if (k === 'row') { if (!/^\d{1,2}:\d{2}$/.test(raw)) { toast('Enter the time as minutes:seconds, for example 7:45'); return; } val = raw; }
    else { val = num(raw); if (val == null || val <= 0) { toast(k === 'cooper' ? 'Enter the distance in metres' : 'Enter the average power in watts'); return; } }
    S.meas.benchmark = S.meas.benchmark || {}; S.meas.benchmark[w] = { test: k, value: val }; S.cardio[w + ':sat'] = { done: true, t: Date.now() }; S.bench = k;
    save(); toast('Result saved'); refresh();
  },
  'mob-len': (el) => { mobShort = el.dataset.v === 'short'; refresh(); },
  'mob-tick': (el) => {
    const iso = isoOf(today()); const k = iso + ':' + el.dataset.n; mobTick[k] = !mobTick[k];
    el.setAttribute('aria-pressed', String(!!mobTick[k])); el.closest('li').classList.toggle('ok', !!mobTick[k]);
    if ($$('.drills .tick').every((b) => b.getAttribute('aria-pressed') === 'true') && !S.mob[iso]) { S.mob[iso] = mobShort ? 'short' : 'full'; save(); toast('Routine logged for today'); refresh(); }
  },
  'mob-log': () => { const iso = isoOf(today()); if (S.mob[iso]) delete S.mob[iso]; else S.mob[iso] = mobShort ? 'short' : 'full'; save(); toast(S.mob[iso] ? 'Routine logged for today' : 'Removed today’s log'); refresh(); },
  hold: (el) => { const s = +el.dataset.s; const side = el.dataset.side === '1'; startRest(s, s, '', { hold: true, label: 'Hold: ' + el.dataset.name.toLowerCase() + (side ? ', first side' : ''), after: side ? 'Switch sides and time it again' : 'Hold finished' }); },
  theme: (el) => { S.theme = el.dataset.v; save(); applyTheme(); refresh(); },
  toggle: (el) => { const k = el.dataset.k; S[k] = !S[k]; save(); el.setAttribute('aria-checked', String(!!S[k])); if (k === 'wake' && !S.wake) wakeOff(); },
  install: async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (e) { /* dismissed */ } installEvt = null; refresh(); },
  'dl-sw': () => download('sw.js', swSource(), 'text/javascript'),
  'export-json': () => download('13-week-program-backup-' + isoOf(new Date()) + '.json', JSON.stringify(S, null, 1), 'application/json'),
  'export-csv': () => download('13-week-training-log-' + isoOf(new Date()) + '.csv', csvLog(), 'text/csv'),
  import: () => { const f = $('#import-file'); if (f) f.click(); },
  'import-yes': () => { if (!pendingImport) return; S = Object.assign(defaults(), pendingImport); pendingImport = null; saveNow(); closeSheet(); toast('Backup imported'); go('#/today'); },
  erase: () => confirmSheet('Erase all data?', 'This removes your start date and every logged set, cardio session and measurement from this browser. Export a backup first if you might want it later.', 'Erase everything', 'erase-yes', '', true),
  'erase-yes': () => { S = defaults(); saveNow(); RT = null; TM = null; setJSON(REST_KEY, null); setJSON(TM_KEY, null); closeSheet(); toast('All data erased'); go('#/today'); }
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault(); audio(); fn(el, e);
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.classList && el.classList.contains('si')) onSetInput(el);
  else if (el.dataset && el.dataset.bind && el.type !== 'date') onBind(el);
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.bind === 'start') onBind(el);
  if (el.id === 'ms-w') { const v = measVal(el.dataset.id, +el.value); $('#ms-v').value = v != null ? fmt(v, 1) : ''; }
  if (el.id === 'import-file' && el.files && el.files[0]) {
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const data = JSON.parse(rd.result);
        if (!data || data.v !== 1 || typeof data.sessions !== 'object') throw new Error('shape');
        pendingImport = data; const n = Object.keys(data.sessions).length;
        confirmSheet('Replace your data with this backup?', 'The backup has ' + plural(n, 'session') + (data.start ? ' and starts on ' + FMT_DAY.format(parseISO(data.start)) : '') + '. Your current data on this device will be replaced.', 'Import backup', 'import-yes');
      } catch (err) { toast('That file is not a backup from this app'); }
      el.value = '';
    };
    rd.readAsText(el.files[0]);
  }
});
document.addEventListener('keydown', (e) => {
  const el = e.target;
  if (e.key === 'Enter' && el.classList && el.classList.contains('si')) {
    e.preventDefault();
    const ins = $$('input.si', el.closest('.set')); const k = ins.indexOf(el);
    if (k < ins.length - 1) ins[k + 1].focus();
    else { const t = el.closest('.set').querySelector('.tick'); if (t && t.getAttribute('aria-pressed') !== 'true') t.click(); el.blur(); }
  }
  if (e.key === 'Enter' && el.id === 'bw-in') { e.preventDefault(); const b = $('[data-act="bw-save"]'); if (b) b.click(); }
});
function onBind(el) {
  const k = el.dataset.bind;
  if (k === 'notes') { const l = sessionLog(+el.dataset.w, el.dataset.sid, true); l.notes = el.value; l.updated = Date.now(); save(); return; }
  if (k === 'start') { if (/^\d{4}-\d{2}-\d{2}$/.test(el.value)) { S.start = el.value; save(); toast('Week 1 starts ' + FMT_DAY.format(parseISO(el.value))); } return; }
  if (k === 'height') { const v = num(el.value); S.height = v && v > 100 && v < 250 ? v : (v == null ? null : S.height); save(); return; }
  if (k === 'steps0') { const v = num(el.value); S.steps0 = v ? Math.round(v) : null; save(); }
}
$('#sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') closeSheet(); });

// timer still running while you look at another page
const _drawRest = drawRest;
drawRest = function (rebuild) {
  if (RT || !TM || location.hash === '#/timer') { _drawRest(rebuild); return; }
  const el = $('#restbar'); el.hidden = false; document.body.classList.add('resting');
  if (rebuild || !el.classList.contains('tmbar')) {
    el.className = 'restbar tmbar';
    el.innerHTML = '<div class="rb-prog" aria-hidden="true"><i></i></div><p class="rb-t"></p><div class="rb-acts"><button data-act="tm-open">Open timer</button></div><p class="rb-l"></p>';
  }
  el.querySelector('.rb-t').innerHTML = TM.finished ? 'Done' : clockHTML(Math.ceil(tmLeft()));
  el.querySelector('.rb-l').textContent = TM.finished ? 'Timer finished. Open it to log the session' : TM.phases[TM.i].name + (TM.paused != null ? ', paused' : '');
};

// ---------- theme and PWA ----------
function applyTheme() {
  const r = document.documentElement;
  if (S.theme === 'light' || S.theme === 'dark') r.setAttribute('data-theme', S.theme); else r.removeAttribute('data-theme');
  $$('meta[name="theme-color"]').forEach((m) => {
    const darkMeta = /dark/.test(m.getAttribute('media') || '');
    m.setAttribute('content', S.theme === 'auto' ? (darkMeta ? '#13203D' : '#F3F5F6') : S.theme === 'dark' ? '#13203D' : '#F3F5F6');
  });
}
function setupManifest() {
  if (!/^https?:$/.test(location.protocol)) return;
  const start = location.href.split('#')[0].split('?')[0];
  const m = {
    name: '13-week athletic hypertrophy program', short_name: '13 Weeks',
    description: 'Sessions, set logging, rest and interval timers, and the full program guide.',
    id: start, start_url: start, scope: new URL('./', start).href, display: 'standalone', orientation: 'portrait',
    background_color: '#F3F5F6', theme_color: '#F3F5F6', categories: ['health', 'fitness', 'sports'],
    icons: [{ src: ICON_192, sizes: '192x192', type: 'image/png', purpose: 'any' }, { src: ICON_512, sizes: '512x512', type: 'image/png', purpose: 'any' }, { src: ICON_512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }]
  };
  const link = document.createElement('link'); link.rel = 'manifest';
  link.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
  document.head.appendChild(link);
}
async function setupSW() {
  if (!('serviceWorker' in navigator) || !window.isSecureContext || !/^https?:$/.test(location.protocol)) return;
  try {
    const r = await fetch('sw.js', { method: 'HEAD', cache: 'no-store' });
    if (r.ok && /javascript/.test(r.headers.get('content-type') || '')) await navigator.serviceWorker.register('sw.js');
  } catch (e) { /* no offline helper beside the file */ }
}

// ---------- boot ----------
ACT.skip = () => { const a = $('#app'); a.focus(); };
$('.tabs').innerHTML = [['today', 'Today'], ['program', 'Program'], ['log', 'Log'], ['guide', 'Guide']].map((t) => '<a href="#/' + t[0] + '" data-tab="' + t[0] + '">' + IC[t[0]] + '<span>' + t[1] + '</span></a>').join('');
applyTheme();
setupManifest();
setupSW();
route();

})();
</script>
</body>
