<style>/* ---------- tokens ---------- */
:root {
  --ground: #F3F5F6;
  --surface: #FFFFFF;
  --ink: #18264A;
  --ink-2: #4A5672;
  --ink-3: #646E87;
  --rule: #D7DCE3;
  --rule-2: #BFC7D3;
  --tint: #E6EAF0;
  --steel: #9AA3B2;
  --inv: #18264A;
  --on-inv: #F3F5F6;
  --p25: #D22B2B;
  --p20: #1F5BB8;
  --p15: #F2B705;
  --p10: #1B8A4B;
  --mix: 30%;
  --hard: #C92626;
  --on-hard: #FFFFFF;
  --focus: #1F5BB8;
  --f-d: "Big Shoulders", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", sans-serif;
  --f-t: "Atkinson Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --pad: 20px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #13203D; --surface: #1B2B4E; --ink: #EDF0F4; --ink-2: #AEB8CB; --ink-3: #8C98AF;
    --rule: #2A3B61; --rule-2: #3B4E79; --tint: #22355D; --steel: #5D6C8C; --inv: #EDF0F4; --on-inv: #13203D;
    --p25: #F0514F; --p20: #5B8DEF; --p15: #F5C431; --p10: #34B36B; --mix: 38%; --hard: #D63A38; --focus: #8DB3FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #13203D; --surface: #1B2B4E; --ink: #EDF0F4; --ink-2: #AEB8CB; --ink-3: #8C98AF;
  --rule: #2A3B61; --rule-2: #3B4E79; --tint: #22355D; --steel: #5D6C8C; --inv: #EDF0F4; --on-inv: #13203D;
  --p25: #F0514F; --p20: #5B8DEF; --p15: #F5C431; --p10: #34B36B; --mix: 38%; --hard: #D63A38; --focus: #8DB3FF;
  color-scheme: dark;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; height: 100%; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px); }
:root { padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; min-height: 100%; background: var(--ground); color: var(--ink);
  font: 400 17px/1.47 var(--f-t); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  font-variant-numeric: tabular-nums;
}
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 99; background: var(--inv); color: var(--on-inv); padding: 10px 14px; border-radius: 8px; }
.skip:focus { top: calc(env(safe-area-inset-top, 0px) + 8px); }
svg { flex: none; }

/* ---------- type ---------- */
.t-xl { font: 760 clamp(56px, 17vw, 88px)/.88 var(--f-d); letter-spacing: .002em; }
.t-l { font: 740 46px/.94 var(--f-d); }
.t-m { font: 720 29px/1.02 var(--f-d); }
.t-s { font: 700 22px/1.05 var(--f-d); }
.d { font-family: var(--f-d); }
.muted { color: var(--ink-2); }
.small { font-size: 15px; line-height: 1.42; }
.cap { font-size: 14px; line-height: 1.38; color: var(--ink-2); }
.prose p + p { margin-top: 10px; }
.prose { max-width: 36em; }
strong, b { font-weight: 720; }

/* ---------- shell ---------- */
#app { min-height: 100vh; padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); outline: none; }
body.focus #app { padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
.view { max-width: 42rem; margin: 0 auto; padding: 14px var(--pad) 32px; }
.tabs {
  position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--ground); border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs a { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 60px; color: var(--ink-2); text-decoration: none; font-size: 12.5px; font-weight: 650; }
.tabs svg { width: 24px; height: 24px; }
.tabs a[aria-current="page"] { color: var(--ink); }
.tabs a[aria-current="page"]::before { content: ""; position: absolute; top: -1px; left: 50%; width: 32px; height: 3px; margin-left: -16px; background: var(--ink); border-radius: 0 0 3px 3px; }
body.focus .tabs { display: none; }
@media (min-width: 960px) {
  .tabs { top: 0; right: auto; width: 96px; grid-template-columns: none; grid-auto-rows: 76px; align-content: start; padding-top: calc(28px + env(safe-area-inset-top, 0px)); border-top: 0; border-right: 1px solid var(--rule); }
  .tabs a[aria-current="page"]::before { top: 50%; left: 0; width: 3px; height: 34px; margin: -17px 0 0; border-radius: 0 3px 3px 0; }
  #app { padding-left: 96px; padding-bottom: 48px; }
  body.focus #app { padding-left: 0; padding-bottom: 150px; }
  .view { padding-top: 32px; }
}

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 24px;
  border-radius: 999px; border: 0; background: var(--inv); color: var(--on-inv); font: 720 17px/1.1 var(--f-t);
  text-decoration: none; text-align: center; transition: transform .12s ease;
}
.btn:active { transform: scale(.98); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--rule-2); }
.btn.sm { min-height: 42px; padding: 0 16px; font-size: 15px; }
.btn.block { display: flex; width: 100%; }
.btn.danger { background: transparent; color: var(--p25); box-shadow: inset 0 0 0 1.5px currentColor; }
.btn[disabled] { opacity: .5; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.link { color: var(--ink); background: none; border: 0; padding: 0; font: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; cursor: pointer; }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; color: var(--ink); text-decoration: none; }
.iconbtn svg { width: 24px; height: 24px; }
.iconbtn:active { background: var(--tint); }

input[type="text"], input[type="number"], input[type="date"], input:not([type]), select, textarea {
  width: 100%; min-width: 0; height: 50px; border: 1.5px solid var(--rule-2); border-radius: 10px; background: var(--surface);
  color: var(--ink); padding: 0 12px; font: 600 18px/1.2 var(--f-t);
}
textarea { height: auto; min-height: 96px; padding: 12px; font-weight: 400; font-size: 16px; line-height: 1.45; resize: vertical; }
select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%); background-position: calc(100% - 20px) 22px, calc(100% - 14px) 22px; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
input::placeholder, textarea::placeholder { color: var(--ink-3); opacity: .8; }
.field { display: grid; gap: 6px; margin: 18px 0 0; }
.field > label, .field > .lab { font-weight: 720; font-size: 15px; }
.field .cap { margin-top: -2px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.unit-in { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; }
.unit-in > span { color: var(--ink-2); font-weight: 650; }

.switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; min-height: 56px; padding: 8px 0; border: 0; border-bottom: 1px solid var(--rule); background: none; text-align: left; }
.switch .sw { position: relative; flex: none; width: 52px; height: 32px; border-radius: 99px; background: var(--rule-2); transition: background .15s; }
.switch .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch[aria-checked="true"] .sw { background: var(--ink); }
.switch[aria-checked="true"] .sw::after { transform: translateX(20px); background: var(--on-inv); }
.switch .lbl b { display: block; }
.switch .lbl span { display: block; font-size: 14px; color: var(--ink-2); line-height: 1.38; margin-top: 2px; }

.seg { display: inline-flex; padding: 3px; border-radius: 99px; background: var(--tint); gap: 2px; }
.seg button { border: 0; background: transparent; min-height: 40px; padding: 0 14px; border-radius: 99px; font-weight: 650; font-size: 15px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(10, 20, 40, .14); }

/* ---------- headers ---------- */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-top: 6px; }
.top .date { font-weight: 720; }
.top .wkline { margin-top: 1px; color: var(--ink-2); font-size: 15px; }
.top .iconbtn { margin: -6px -10px 0 0; }
.pagehead { padding-top: 10px; }
.pagehead .t-l { margin-top: 4px; }
.pagehead p { margin-top: 8px; color: var(--ink-2); max-width: 34em; }
.back { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; margin-left: -8px; padding-right: 8px; color: var(--ink); font-weight: 650; text-decoration: none; }
.back svg { width: 22px; height: 22px; }
.sec { font: 720 29px/1.02 var(--f-d); margin: 40px 0 12px; }
.sec + .cap { margin: -6px 0 12px; }
.sub { font: 700 21px/1.1 var(--f-d); margin: 26px 0 8px; }

/* ---------- the block arc (13 plates on a bar) ---------- */
.arc { --disc: 104px; position: relative; display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 3px; margin: 14px 14px 0; }
.arc.big { --disc: 156px; gap: 4px; margin-top: 18px; }
.arc-bar { position: absolute; left: -14px; right: -14px; top: calc(var(--disc) / 2 - 2.5px); height: 5px; background: var(--steel); border-radius: 3px; pointer-events: none; }
.arc-bar::before, .arc-bar::after { content: ""; position: absolute; top: -8px; width: 6px; height: 21px; background: var(--steel); border-radius: 2px; }
.arc-bar::before { left: 5px; } .arc-bar::after { right: 5px; }
.plate { position: relative; display: flex; flex-direction: column; color: var(--ink-2); text-decoration: none; border-radius: 6px; -webkit-tap-highlight-color: transparent; }
.disc { position: relative; height: var(--disc); }
.disc::before, .disc > i { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: calc(var(--h) * 100%); transform: translateY(-50%); border-radius: 4px; transform-origin: 50% 50%; }
.disc::before { background: color-mix(in srgb, var(--tier) var(--mix), var(--ground)); }
.disc > i { background: linear-gradient(to top, var(--tier) calc(var(--f) * 100%), transparent calc(var(--f) * 100%)); }
.plate .wk { font: 640 16px/1 var(--f-d); text-align: center; margin-top: 8px; }
.plate.now .wk { color: var(--ink); font-weight: 880; }
.plate.now .disc::after { content: ""; position: absolute; left: -3px; right: -3px; top: 50%; height: calc(var(--h) * 100% + 8px); transform: translateY(-50%); border: 2px solid var(--ink); border-radius: 7px; }
.arc.big .plate .wk { font-size: 18px; }
.t-10 { --tier: var(--p10); } .t-15 { --tier: var(--p15); } .t-20 { --tier: var(--p20); } .t-25 { --tier: var(--p25); }
@keyframes load { from { transform: translateY(-50%) scaleY(0); } to { transform: translateY(-50%) scaleY(1); } }
.arc.intro .disc::before, .arc.intro .disc > i { animation: load .55s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 38ms); }
.arc-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 16px 0 0; font-size: 14px; color: var(--ink-2); }
.arc-legend span { display: inline-flex; align-items: center; gap: 7px; }
.arc-legend i { display: inline-block; width: 8px; height: 18px; border-radius: 2px; background: var(--tier); }

/* ---------- today ---------- */
.hero { margin-top: 32px; }
.hero .t-xl { margin-bottom: 12px; overflow-wrap: anywhere; }
.hero .lede { color: var(--ink-2); }
.hero .lede + .lede { margin-top: 2px; }
.hero .state { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 10px; font-weight: 720; }
.hero .state svg { width: 20px; height: 20px; }
.also { margin-top: 26px; border-top: 1px solid var(--rule); }
.also a, .also .item { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--rule); text-decoration: none; color: var(--ink); }
.also b { display: block; }
.also span.cap { display: block; }
.chev { width: 20px; height: 20px; color: var(--ink-3); }

.days { list-style: none; border-top: 1px solid var(--rule); }
.days li { border-bottom: 1px solid var(--rule); }
.days a, .days .dl { position: relative; display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: baseline; padding: 13px 0; color: var(--ink); text-decoration: none; }
.days .dn { font: 720 19px/1 var(--f-d); color: var(--ink-2); }
.days .dt { min-width: 0; }
.days .dt b { font-weight: 700; }
.days .dt .cap { display: block; margin-top: 1px; }
.days li.is-today .dn { color: var(--ink); }
.days li.is-today a::before, .days li.is-today .dl::before { content: ""; position: absolute; left: calc(-1 * var(--pad)); top: 10px; bottom: 10px; width: 4px; background: var(--ink); border-radius: 0 3px 3px 0; }
.st { font-size: 14px; color: var(--ink-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.st svg { width: 18px; height: 18px; }
.st.done { color: var(--ink); font-weight: 700; }

.due { list-style: none; border-top: 1px solid var(--rule); }
.due li { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: start; padding: 13px 0; border-bottom: 1px solid var(--rule); }
.due .box { width: 24px; height: 24px; margin-top: 1px; border-radius: 6px; border: 2px solid var(--ink-2); display: grid; place-items: center; color: var(--on-inv); background: transparent; padding: 0; }
.due .box svg { width: 16px; height: 16px; opacity: 0; }
.due li.ok .box { background: var(--ink); border-color: var(--ink); }
.due li.ok .box svg { opacity: 1; }
.due .cap { margin-top: 2px; }
.due .act { align-self: center; }

.targets { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; border-top: 1px solid var(--rule); }
.targets div { padding: 12px 0; border-bottom: 1px solid var(--rule); min-width: 0; }
.targets dt { font-size: 14px; color: var(--ink-2); }
.targets dd { font: 700 22px/1.1 var(--f-d); margin-top: 3px; }
.targets dd small { font: 400 14px/1.3 var(--f-t); color: var(--ink-2); display: block; margin-top: 3px; }

.bw { margin-top: 14px; }
.bw .unit-in { grid-template-columns: minmax(0, 9rem) auto auto; justify-content: start; }
.bw input { font: 720 28px/1 var(--f-d); }

/* ---------- program / weeks ---------- */
.phase { margin-top: 36px; }
.phase h2 { font: 720 29px/1.02 var(--f-d); }
.phase > p { margin-top: 6px; color: var(--ink-2); max-width: 36em; }
.weeks { list-style: none; margin-top: 12px; border-top: 1px solid var(--rule); }
.weeks a { display: grid; grid-template-columns: 12px 1fr auto; gap: 2px 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--rule); color: var(--ink); text-decoration: none; }
.weeks .pc { grid-row: 1 / 3; width: 12px; height: 40px; border-radius: 3px; background: var(--tier); }
.weeks .wn { font: 720 25px/1 var(--f-d); }
.weeks .wd { grid-column: 2 / 4; font-size: 15px; color: var(--ink-2); }
.weeks .now .wn::after { content: "This week"; font: 700 13px/1 var(--f-t); margin-left: 10px; padding: 4px 8px; border-radius: 99px; background: var(--inv); color: var(--on-inv); vertical-align: 5px; }
.glance { margin-top: 10px; }

.wkhead { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
.wkhead .pc { width: 18px; height: 64px; border-radius: 4px; background: var(--tier); margin-bottom: 6px; }
.facts { margin-top: 18px; border-top: 1px solid var(--rule); }
.facts div { display: grid; grid-template-columns: 8.5rem 1fr; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--rule); }
.facts dt { color: var(--ink-2); font-size: 15px; }
.facts dd { font-weight: 600; }
.panel { margin-top: 16px; padding: 18px; border-radius: 16px; background: var(--tint); }
.panel h3 { font: 720 22px/1.05 var(--f-d); }
.panel p { margin-top: 6px; }
.qs { list-style: none; margin-top: 12px; }
.qs li { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid color-mix(in srgb, var(--ink) 12%, transparent); }
.qs .seg { background: color-mix(in srgb, var(--ground) 70%, transparent); }

/* ---------- session ---------- */
.sbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 6px; min-height: 56px; margin: -14px calc(-1 * var(--pad)) 0; padding: 0 10px; background: color-mix(in srgb, var(--ground) 94%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid transparent; transition: border-color .2s; }
.sbar.scrolled { border-bottom-color: var(--rule); }
.sbar .ttl { flex: 1; min-width: 0; font: 720 21px/1 var(--f-d); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .2s; }
.sbar.scrolled .ttl { opacity: 1; }
.sbar .back { margin-left: 0; }
@media (min-width: 960px) { .sbar { margin-top: -32px; } }
.shead { margin-top: 10px; }
.shead .t-xl { margin-top: 2px; }
.shead .lede { margin-top: 10px; color: var(--ink-2); }
.eff { display: flex; flex-wrap: wrap; gap: 10px 26px; margin-top: 16px; }
.eff div { min-width: 0; }
.eff dt { font-size: 14px; color: var(--ink-2); }
.eff dd { font: 740 30px/1 var(--f-d); margin-top: 3px; }
.notice { margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: var(--tint); font-size: 15px; line-height: 1.42; }
.notice b { display: block; margin-bottom: 2px; font-size: 16px; }
.notice .btns { margin-top: 10px; }

details.fold { margin-top: 18px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
details.fold > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; font-weight: 720; cursor: pointer; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: ""; width: 10px; height: 10px; border-right: 2px solid var(--ink-2); border-bottom: 2px solid var(--ink-2); transform: rotate(45deg) translate(-3px, -3px); transition: transform .2s; }
details.fold[open] > summary::after { transform: rotate(-135deg) translate(-3px, -3px); }
details.fold .fold-in { padding: 0 0 16px; }
.steps { list-style: none; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 30px 1fr; gap: 8px; padding: 8px 0; }
.steps li::before { counter-increment: s; content: counter(s); font: 760 22px/1 var(--f-d); color: var(--ink-3); }
.steps .cap { display: block; }

.exlist { list-style: none; margin-top: 26px; }
.ex { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 0 8px; padding: 24px 0 22px; border-top: 1px solid var(--rule); }
.ex.in-sup { box-shadow: inset 3px 0 0 var(--rule-2); margin-left: -14px; padding-left: 14px; }
.ex.sup-b { border-top-style: dashed; }
.ex-n { font: 800 30px/1 var(--f-d); color: var(--ink-3); padding-top: 1px; }
.ex.done .ex-n { color: var(--ink); }
.ex-name { font: 720 25px/1.04 var(--f-d); }
.ex-name .nm { background: none; border: 0; padding: 0; text-align: left; font: inherit; color: inherit; display: inline; text-decoration: underline; text-decoration-color: var(--rule-2); text-decoration-thickness: 2px; text-underline-offset: 5px; }
.ex-name .nm.fixed { text-decoration: none; cursor: default; }
.star { display: inline-block; width: .62em; height: .62em; margin-left: .18em; vertical-align: .02em; color: var(--p15); }
.tag { display: inline-block; font: 700 12.5px/1 var(--f-t); padding: 4px 8px 3px; border-radius: 99px; background: var(--tint); color: var(--ink-2); vertical-align: 4px; margin-left: 6px; }
.ex-rx { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-top: 9px; }
.rx { font: 740 25px/1 var(--f-d); }
.ex-rx .cap { font-size: 14.5px; }
.ex-last { margin-top: 10px; font-size: 15px; line-height: 1.42; color: var(--ink-2); }
.ex-last b { color: var(--ink); }
.ex-tip { margin-top: 6px; font-size: 14.5px; line-height: 1.4; color: var(--ink-2); }
.sets { margin-top: 14px; }
.set-h, .set { display: grid; grid-template-columns: var(--cols); gap: 8px; align-items: center; }
.set-h { font-size: 12.5px; font-weight: 720; color: var(--ink-2); }
.set-h span:first-child { text-align: center; }
.set { margin-top: 8px; }
.set .sn { font: 800 21px/1 var(--f-d); text-align: center; color: var(--ink-2); }
.set input { height: 52px; padding: 0 10px; font: 720 27px/1 var(--f-d); border-radius: 11px; text-align: left; }
.set input::placeholder { font-weight: 560; }
.set.is-done input { background: var(--tint); border-color: transparent; }
.set.is-done .sn { color: var(--ink); }
.set.opt input { border-style: dashed; background: transparent; }
.set.opt .sn { color: var(--ink-3); }
.tick { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--ink); background: transparent; color: var(--on-inv); display: grid; place-items: center; padding: 0; transition: background .12s; }
.tick svg { width: 24px; height: 24px; opacity: 0; }
.tick[aria-pressed="true"] { background: var(--ink); }
.tick[aria-pressed="true"] svg { opacity: 1; }
.set-note { margin: 6px 0 0 calc(30px + 8px); font-size: 13.5px; color: var(--ink-2); line-height: 1.38; }
.ex-tools { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 14px; }
.ex-tools .link { font-size: 15px; font-weight: 650; text-decoration-color: var(--rule-2); min-height: 32px; }
.pts { margin-top: 10px; padding: 12px 14px; border-left: 3px solid var(--rule-2); font-size: 15.5px; line-height: 1.45; }
.pts p + p { margin-top: 8px; }
.pts .from { color: var(--ink-2); font-size: 14px; display: block; margin-top: 8px; }
.calib { margin-top: 12px; padding: 14px; border-radius: 14px; background: var(--tint); font-size: 15px; }
.calib .row2 { margin-top: 10px; }
.calib .res { margin-top: 10px; font-weight: 650; }
.sfoot { margin-top: 10px; border-top: 1px solid var(--rule); padding-top: 22px; }
.safety { margin-top: 18px; font-size: 14.5px; color: var(--ink-2); line-height: 1.45; }

/* ---------- rest bar ---------- */
.restbar { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--inv); color: var(--on-inv); }
body:not(.focus) .restbar { bottom: calc(60px + env(safe-area-inset-bottom, 0px)); padding-bottom: 14px; }
@media (min-width: 960px) { body:not(.focus) .restbar { bottom: 0; left: 96px; padding-bottom: 14px; } }
.restbar[hidden] { display: none; }
.rb-prog { position: absolute; left: 0; right: 0; top: 0; height: 4px; background: color-mix(in srgb, var(--on-inv) 22%, transparent); }
.rb-prog i { display: block; height: 100%; width: calc(var(--p, 0) * 100%); background: var(--on-inv); }
.rb-l { font-size: 14px; font-weight: 650; opacity: .82; line-height: 1.3; min-width: 0; }
.rb-t { font: 820 46px/1 var(--f-d); }
.rb-t .dg { display: inline-block; width: .5em; text-align: center; }
.rb-acts { display: flex; gap: 8px; grid-row: 1 / 3; grid-column: 2; }
.rb-acts button { min-height: 46px; padding: 0 16px; border: 0; border-radius: 99px; background: color-mix(in srgb, var(--on-inv) 15%, transparent); color: var(--on-inv); font-weight: 720; font-size: 15px; }
.restbar.ready .rb-t { color: var(--p15); }
.restbar.go { grid-template-columns: minmax(0, 1fr) auto; }

/* ---------- timer ---------- */
.timer { position: fixed; inset: 0; z-index: 45; display: flex; flex-direction: column; background: var(--ground); color: var(--ink); padding: calc(10px + env(safe-area-inset-top, 0px)) var(--pad) calc(22px + env(safe-area-inset-bottom, 0px)); }
.timer.hard { background: var(--hard); color: var(--on-hard); --ink-2: rgba(255,255,255,.86); --rule-2: rgba(255,255,255,.4); --inv: #FFFFFF; --on-inv: var(--hard); }
.timer .tm-top { display: flex; align-items: center; justify-content: space-between; min-height: 48px; }
.timer .tm-title { font-weight: 720; }
.timer .tm-body { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 42rem; width: 100%; margin: 0 auto; }
.tm-phase { font: 760 38px/1 var(--f-d); }
.tm-clock { font: 820 clamp(110px, 36vw, 240px)/.84 var(--f-d); margin: 14px 0 10px; letter-spacing: -.005em; }
.tm-clock .dg { display: inline-block; width: .5em; text-align: center; }
.tm-cue { font-size: 18px; line-height: 1.4; color: var(--ink-2); max-width: 26em; }
.tm-next { margin-top: 18px; font-size: 15px; color: var(--ink-2); }
.tm-segs { display: flex; gap: 3px; height: 12px; margin-top: 26px; }
.tm-segs i { flex: var(--d) 1 0; border-radius: 3px; background: color-mix(in srgb, currentColor 18%, transparent); position: relative; overflow: hidden; }
.tm-segs i.hard { background: color-mix(in srgb, var(--p25) 40%, transparent); }

<script type="text/plain" id="program-md"># 13-week athletic hypertrophy program with cardio and mobility

Prepared for you: male, 30 years, 180 cm, about 75 kg, drug-free, with under 1 month of structured lifting. Written in October 2026 for a 13-week block (12 training weeks and 1 reassessment week) in a commercial gym with barbells, a rack with safety bars, dumbbells, cable stations and common machines.

> A note on the citations: they were originally written from memory. Key citations have since been verified against the literature and corrected where necessary (notably the Pelland et al. publication year and several characterisations of study findings), but errors may remain. Verify any citation before relying on it or passing it on. Volume and page numbers are given only for Pelland et al.; for the other entries they are omitted for the same reason. Three references added in a later revision (Atkinson & Batterham 2015, Gardiner 2023 and Hultman 1996) have not yet been checked against the original papers.

## Contents

1. At a glance
2. How to read this program
3. Safety and screening
4. Realistic expectations
5. Weekly structure
6. The sessions
7. How to run every session
8. Cardiovascular training
9. Mobility and flexibility
10. Nutrition
11. Sleep and stress
12. Monitoring and decision rules
13. Week 13 and what comes next
14. Evidence summary for each design decision
15. What remains uncertain
16. References

Appendices: A, training log templates; B, weekly checklist.

## 1. At a glance

| | Weeks 1–4: foundation | Weeks 5–12: build | Week 13: reassess |
|---|---|---|---|
| Lifting | 3 full-body sessions a week (A, B, C) | 4 sessions a week: Upper A, Lower A, Upper B, Lower B | The 4 build sessions with about half the sets |
| Weekly sets per muscle | About 6–10 for most muscles | About 8–12 for most muscles (calves and front delts 6); from week 9, about 9–14 for chest, back, side delts and arms | About half of week 12 |
| Effort (reps in reserve, RIR) | RIR 3–4 in week 1, reaching RIR 2 by week 4 | RIR 1–2 on compound lifts, 0–2 on isolation lifts | RIR 3–4 |
| Cardio | 2 easy sessions of 30–40 min | 1 easy session of 40–60 min, 1 short easy session of 20–30 min after Upper A, 1 interval session | 1–2 easy sessions and an aerobic retest |
| Mobility | 12–15 min routine, 4–5 days a week | Same | Same, plus the mobility retest |
| Daily steps | Add about 1,000 a day to your current count every 2 weeks | Keep adding until you reach 8,000–10,000 (by about week 8) | Keep |
| Calories | About maintenance: start near 2,600 kcal/day and calibrate | About maintenance | Choose the next phase: gain, maintain or lose |
| Protein | 1.6–2.2 g/kg/day (120–165 g; aim for 140–160 g) | Same | Same |

The plan starts with three full-body sessions a week while you learn the lifts and moves to a four-day upper/lower split in week 5. Cardio is mostly easy and mostly on low-impact machines, at a dose the concurrent-training research suggests is unlikely to slow muscle growth much. Calories stay near maintenance for 12 weeks; at your training age that has been reported to allow muscle gain with little or no fat gain, although the evidence is limited (10.2). Week 13 is a lighter week for retesting and for choosing the next nutrition phase.

## 2. How to read this program

### 2.1 Evidence grades

Design choices carry a grade in square brackets, such as [B].

| Grade | Meaning |
|---|---|
| A | Consistent findings across several meta-analyses or many well-run randomised trials that measured the outcome that matters here |
| B | Meta-analyses, or several randomised trials pointing the same way, with real limitations such as small samples, short duration, indirect outcomes or inconsistent results |
| C | One or a few small trials, acute or mechanistic studies, or observational data |
| D | Expert consensus, guidelines or coaching convention where direct trial evidence is thin or absent |

The grades are my informal judgement, loosely modelled on the GRADE approach; they are not a formal GRADE assessment. Two limits apply to almost every training claim below. Most hypertrophy trials last 6–12 weeks and have roughly 10–20 participants per group, which is too few to detect small differences reliably. They measure muscle thickness, cross-sectional area or lean mass, and none of them measures whether a body looks athletic, so applying their results to your goal is an inference.

### 2.2 Your goals as trainable and measurable targets

| Your goal | How this plan interprets it | How you will track it |
|---|---|---|
| Aesthetic, athletic body | More muscle on the shoulders (especially the side delts), upper back, chest and arms; legs developed in proportion; a waist that stays the same or gets smaller | Photos, waist measurement, optional shoulder and arm measurements, strength trends |
| Not bodybuilder-bulky | Moderate weekly volume (about 8–14 sets per muscle), no large calorie surplus, and a stop rule: once you like your size, hold calories at maintenance and cut sets back | Waist trend, photos, your own judgement |
| Cardiovascular fitness without hurting muscle growth | Mostly easy cardio on low-impact machines plus one interval session a week from week 5, kept away from leg training | Submaximal heart-rate test, a maximal benchmark test, resting heart rate |
| Mobility and flexibility | Full-range lifting plus a 12–15 min routine for hips, hamstrings, ankles, chest, shoulders and upper back, 4–5 days a week | Four range-of-motion tests in weeks 1 and 13 |
| Athletic qualities beyond size | Low-volume jumps, loaded carries and interval work | Benchmark test; jump distance or height if you want to record it |

The emphasis on the upper back and side delts follows from what "athletic" usually means: broad shoulders over a relatively narrow waist. In one set of studies, ratings of men's bodily attractiveness were explained largely by cues of upper-body strength (Sell 2017 [C]). Such ratings may vary across cultures and raters, and they are not the same thing as your own preferences, so treat this as weak support. If you want a different emphasis later, the volume table in 6.6 shows where to move sets.

### 2.3 Assumptions and unknowns

| Item | Assumption | If the assumption is wrong |
|---|---|---|
| Equipment | Commercial gym: barbells, a rack with safety bars, dumbbells, cable stations, leg press, leg curl and leg extension machines | Use the substitutions in 6.7 |
| Body fat | About 15–18% (not measured) | The week-13 nutrition decision is based on your waist measurement, so a wrong guess only shifts that decision |
| Current calorie intake | Unknown | Weeks 1–3 include a calibration step (10.1) |
| Sleep | About 7 h a night | If you average under 6.5 h, expect slower progress and fix sleep before adding sets (section 11) |
| Time per session | Up to about 70 min including warm-up | Use the time-saving rules in 6.5 |
| Technique | Still being learned | Weeks 1–4 use easier-to-learn variations; one or two coached sessions or filming your sets helps (7.7) |
| Judging effort | Not yet accurate, which is normal for beginners | Calibration sets from week 4 (7.3) |
| Health | No known disease, injury or symptoms, as you reported | Section 3 lists the symptoms that should stop training |

### 2.4 Terms used

| Term | Meaning |
|---|---|
| 3 × 8–12 | 3 working sets of 8 to 12 repetitions; warm-up sets are not counted |
| RIR (reps in reserve) | How many more good reps you could have done when you stopped; RIR 2 means you stopped with about 2 left |
| Technical failure | The point where the next rep would need an obvious breakdown in form (RIR 0) |
| Compound lift | A multi-joint exercise such as a squat, press, row or deadlift |
| Isolation lift | A single-joint exercise such as a curl, lateral raise or leg curl |
| Double progression | Add reps within the rep range first; when every set reaches the top of the range, add load |
| e1RM | Estimated one-repetition maximum, calculated from a set of 10 reps or fewer |
| ★ | An exercise that gains one set in weeks 9–12 if you pass the recovery check (6.3) |
| Superset | Two exercises done back to back before resting; used here for muscles that do not compete, with one partial exception in Upper B (6.4) |
| Easy cardio ("zone 2") | Cardio at an effort where you can still talk in full sentences |
| RPE | Rating of perceived exertion on a 0–10 scale |
| HRmax | Maximum heart rate |
| Recomposition | Gaining muscle while losing fat at roughly maintenance calories, without a dedicated surplus or deficit phase |

## 3. Safety and screening

You reported no known heart, metabolic or kidney disease and no symptoms. For someone in that position, the American College of Sports Medicine's screening algorithm does not require medical clearance before starting light-to-moderate exercise, as long as intensity is increased gradually (Riebe 2015 [D]). This plan starts easy: the first efforts above easy are optional 20 s pick-ups in weeks 3–4, the first maximal effort is the aerobic test at the end of week 4 (12.2), and hard intervals start in week 5.

Stop the session and get medical advice if you have chest pain, pressure or tightness, or pain spreading to the arm, neck or jaw; if you faint or nearly faint; if you are far more breathless than the effort explains; if your heartbeat races, pounds or becomes irregular and does not settle with rest; or if you get a sudden, severe headache. Chest pain that is severe or does not settle quickly with rest needs emergency care.

Two optional checks are worth doing before you start [D]. If you have never had your blood pressure measured, get a reading; if repeated readings are 140/90 mmHg or higher, see a doctor before hard training. If a parent or sibling died suddenly before about age 50, or has an inherited heart condition, tell a doctor before starting high-intensity intervals.

Injury rates in the weight-training sports are low, in the range of a few injuries per 1,000 hours of training, and those data come from competitive lifters using far heavier loads than this plan does (Keogh & Winwood 2017 [C]). The practical safety rules are simple: use safety bars or a spotter for barbell bench press and squat, keep at least 1–2 reps in reserve on barbell lifts, and replace any exercise that causes sharp or joint pain (6.7).

## 4. Realistic expectations

Strength rises fastest in the first weeks, much of it from learning the movements and from changes in how the nervous system recruits muscle (Moritani & deVries 1979 [C]). Early increases in measured muscle size are partly swelling. In one trial, much of the increase in cross-sectional area seen after the first 3 weeks coincided with muscle oedema (Damas 2016a [C]), and in a related study the early rise in muscle protein synthesis tracked muscle damage rather than later growth (Damas 2016b [C]).

Muscle gain itself is slower. A meta-analysis of resistance-training trials in healthy men found an average lean-mass gain of roughly 1.5 kg over trials that mostly lasted a few months (Benito 2020 [B]). Lean mass includes water and glycogen, and the average hides a wide spread: in 585 people who trained their arms for 12 weeks, changes in muscle cross-sectional area ranged from −2% to +59% (Hubal 2005 [C]). Part of an observed spread like this is measurement error and day-to-day variation rather than true differences in response (Atkinson & Batterham 2015 [C]), and the same noise makes a single before-and-after comparison unreliable for judging how one person responded (Hecksteden 2018 [C]).

A reasonable working expectation for your 13 weeks is clear strength gains on every lift, somewhere around 1–2 kg of lean mass if training, protein and sleep are consistent (with real uncertainty in both directions), and visible change in photos, which many people first notice around weeks 8–12 [D].

Becoming bulky by accident is unlikely, because drug-free muscle gain is slow enough that you will see it coming. What you build is also easy to keep. Young adults kept the muscle-fibre growth from 16 weeks of training for a further 32 weeks while doing one-ninth of the original training volume (Bickel 2011 [C]). In another trial, taking 3-week breaks every 6 weeks gave similar gains over 24 weeks to training continuously (Ogasawara 2013 [C]). You can stop adding volume and calories at any point and hold your result with much less work.

Visible abdominal definition depends mainly on body fat. In a small trial, 6 weeks of abdominal exercise did not reduce abdominal fat compared with no exercise (Vispute 2011 [C]). Trunk exercises are in this plan for strength and function.

A typical pattern [D], although your own timing may differ:

| Period | What usually happens | What it means |
|---|---|---|
| Weeks 1–2 | Soreness after the first sessions; loads rise quickly; body weight may rise 0.5–1.5 kg | Soreness fades as the muscles adapt to the work; the early weight is mostly glycogen and water |
| Weeks 3–6 | Loads still rising quickly; muscles feel firmer | Mostly skill and nervous-system gains, with growth beginning |
| Weeks 7–13 | Progress slows to small, steady increases; photos and tape start to show change | Muscle is accumulating; judge by trends over 4 weeks or more |

## 5. Weekly structure

### 5.1 Weeks 1–4

| Day | Session | Approximate time |
|---|---|---|
| Monday | Full-body A | 50–65 min (about 40 min in week 1) |
| Tuesday | Easy cardio 30–40 min, then the mobility routine | 45–55 min |
| Wednesday | Full-body B | 50–65 min |
| Thursday | Rest, or a walk and the mobility routine | Optional |
| Friday | Full-body C | 50–65 min |
| Saturday | Easy cardio 30–40 min, then the mobility routine | 45–55 min |
| Sunday | Rest | – |

### 5.2 Weeks 5–12

| Day | Session | Approximate time |
|---|---|---|
| Monday | Upper A, then 20–30 min easy cycling or incline walking (or do this cardio at another time of day) | 75–95 min in total |
| Tuesday | Lower A | 60–70 min |
| Wednesday | Easy cardio 40–60 min, then the mobility routine | 55–75 min |
| Thursday | Upper B | 50–60 min |
| Friday | Lower B | 60–70 min |
| Saturday | Interval session, then the mobility routine | 50–60 min |
| Sunday | Rest (the mobility routine is fine) | – |

### 5.3 Why four lifting days and not six

You have up to six days. Using all of them for lifting would cost time and recovery for little expected benefit. When weekly sets are matched, meta-analyses find that training a muscle more than twice a week, or choosing a split over full-body sessions, makes little or no difference to muscle growth (Schoenfeld 2019; Ramos-Campo 2024 [B]). Training each muscle at least twice a week does appear better than once a week when volume is not matched (Schoenfeld 2016a [B]). Four sessions give every muscle two sessions a week and leave room for cardio, mobility and one full rest day.

### 5.4 Why full-body sessions first

Three full-body sessions let you practise each movement pattern (squat, hinge, push and pull) two or three times a week while each muscle gets only a few sets per session, which tends to keep soreness manageable while you learn [D]. From week 5 the split changes, so weekly volume can rise without any single session becoming very long.

### 5.5 Moving sessions around

| Rule | Reason |
|---|---|
| Keep at least one full rest day a week | Recovery, and time for life outside the gym [D] |
| Leave about 48 hours between two sessions that train the same large muscle groups hard, such as two lower-body sessions | Gives the muscles time to recover before they are loaded heavily again [D]. The side delts, trained on Monday and again on Tuesday in weeks 5–12, are a deliberate exception because the Tuesday work is two high-rep isolation sets; if they are still sore on Tuesday, keep those sets at RIR 2 or more [D] |
| Keep hard intervals at least 24 hours before a lower-body session | In one study, leg strength performance was reduced for at least 4–8 hours after hard cardio and had recovered by 24 hours (Sporer & Wenger 2003 [C]); 24 hours is a conservative margin |
| If cardio and lifting fall on the same day, lift first, or separate them by about 6 hours or more | When both were done in one session, lifting first favoured lower-body strength gains, with no clear effect of order on muscle growth (Murlasits 2018 [B]); explosive strength gains were blunted mainly when both shared a session (Schumann 2022 [B]); the 6-hour gap is a common convention [D] |
| In a week when you can lift only three times, do full-body A, B and C at your current loads and effort targets | Every muscle still gets trained at least twice that week |
| The minimum useful week is two full-body sessions and one cardio session | Low weekly volumes still produce worthwhile gains in people new to training, so a short week costs little (Iversen 2021 [C]) |

## 6. The sessions

Every session starts with the warm-up in 7.1. Rest times are guides; use the longer end after harder sets.

The recovery check comes at the end of week 8. Add the ★ sets only if all four of these were true over weeks 6–8: most lifts improved in load or reps; soreness from a session had gone before you trained that muscle again; you slept at least 7 h on most nights; and you had no joint pain. If any was false, keep the week-8 sets and check again two weeks later.

Technical failure (RIR 0) is used only on the last set of machine, cable or dumbbell isolation exercises, and on the occasional calibration set in 7.3, which can be a machine or cable compound such as the leg press or pulldown. **Never take barbell squats, bench presses or deadlifts to failure**; keep at least 1 rep in reserve on those.

### 6.5 If you are short of time

Superset the last two exercises when they train different muscles, drop the trunk exercise or the power primer, and use the shorter rest periods on isolation exercises. Keep the first three exercises of every session, because they carry most of the volume for the large muscle groups. For a whole week with little time, use the minimum week in 5.5.

### 6.6 Weekly volume per muscle

A set counts as 1 for a muscle that is a main mover and 0.5 for a muscle that assists. This fractional count fitted hypertrophy data better than the alternatives in a recent meta-regression (Pelland 2026 [B]). Deciding which muscles are main movers in each exercise is an approximation.

| Muscle | Weeks 1–4 | Weeks 5–8 | Weeks 9–12 (all ★ sets added) |
|---|---|---|---|
| Chest | 6 | 8 | 9 |
| Lats and mid-back | 9 | 12 | 14 |
| Side delts | 6.5 | 9 | 11 |
| Rear delts | ~4.5 | ~8 | ~9 |
| Front delts | 6 | 6 | 6.5 |
| Biceps | 6.5 | 10 | 11 |
| Triceps | 6.5 | 9 | 9.5 |
| Quads | 9.5 | 11.5 | 11.5 |
| Hamstrings | 7.5 | 9.5 | 9.5 |
| Glutes | ~11 | ~11.5 | ~11.5 |
| Calves | 6 | 6 | 6 |
| Trunk (direct work) | 6 | 8 | 8 |

How the counts were made: Romanian deadlifts count fully for hamstrings and glutes; trap-bar deadlifts count fully for glutes and half for quads and hamstrings; split squats count fully for quads and glutes; squats and leg presses count half for glutes. Every row and pulldown counts half for the rear delts. Their real contribution to pulldowns is uncertain, so treat the rear-delt totals as upper estimates. Farmer's carries count toward trunk. The weeks 1–4 column shows weeks 2–4; week 1 totals are lower because every exercise gets 2 sets (6.1).

On average, more weekly sets produce more growth, with smaller returns for each added set (Schoenfeld 2017a; Pelland 2026 [B]). The back gets the most sets, and the side delts get the most isolation work (8 sets of lateral raises a week, 10 from week 9 with the ★ sets), because both shape the shoulder-to-waist outline. Legs sit at roughly 10–12 sets so they keep pace with the upper body without dominating recovery. Front delts get no isolation work, such as front raises, because pressing, including the shoulder press, already trains them [D].

Rep ranges are mostly 6–15, with higher ranges for lateral raises and calves. Muscle growth is similar across a wide range of loads when sets are taken close to failure, while heavier loads favour maximal strength (Schoenfeld 2017b; Lopez 2021 [A]). Moderate ranges are used here because very high-rep sets are harder to judge for effort and more draining to take close to failure [D].

| If you can't do it (or it hurts) | Use instead |

| Back squat | Hack squat, Smith-machine squat, safety-bar squat, or deep leg press |
| Barbell bench press | Dumbbell bench press, machine chest press or Smith-machine bench press |
| Trap-bar deadlift | Conventional deadlift (keep 2 or more reps in reserve), or dumbbell Romanian deadlift plus hip thrust |
| Pull-up | Assisted pull-up, band-assisted pull-up or lat pulldown |
| Seated leg curl | Lying leg curl, assisted Nordic curl or Swiss-ball leg curl |
| Cable overhead triceps extension | Dumbbell or EZ-bar overhead extension |
| Cable lateral raise | Dumbbell or machine lateral raise |
| Chest-supported dumbbell row | One-arm dumbbell row, chest-supported T-bar row or machine row |
| Bulgarian split squat | Reverse lunge, step-up or split squat |
| Leg extension | Reverse Nordic, assisted sissy squat or step-down |
| Calf raise machine | Single-leg dumbbell calf raise on a step, or calf press on the leg press |
| Farmer's carry | Suitcase carry or a static heavy hold |
| Jumps | Countermovement jump in place, or medicine-ball slam |

Substitute when an exercise causes sharp pain, pain in a joint, or pain that is worse the next day, or when the equipment is not available. Pick a substitute that trains the same muscles through a similar range of motion, and do its first session at RIR 3.

If your grip fails before the target muscles on deadlift or row variations, use lifting straps for the working sets and add 2–3 sets of static barbell holds (hold a heavy barbell for 20–30 s) at the end of one session per week. Straps let the intended muscles do the work [D].

## 7. How to run every session

### 7.1 Warm-up (about 10 min)

| Step | What to do | Time |
|---|---|---|
| 1 (optional) | Easy cardio | 3–5 min |
| 2 | Dynamic drills for the joints you are about to use, such as leg swings, bodyweight squats, hip hinges, arm circles and band pull-aparts | 3–4 min |
| 3 | Ramp-up sets on the first exercise: about 50% of the working load for 8 reps, 70% for 4–5 reps and 85% for 2–3 reps; later exercises need one lighter feeler set | 3–4 min |

Brief static stretching before lifting (under about 60 s per muscle) is fine if you like it; at that duration the effect on performance is trivial (Behm 2016 [B]).

### 7.2 Starting loads

In week 1, pick loads that leave about 3–4 reps in reserve at the top of the rep range. When unsure, go lighter: overshooting in week 1 mostly buys extra soreness. Record every working set with load, reps and estimated RIR. By week 3 your log will show your real working weights.

### 7.3 Effort: reps in reserve

Muscle growth tends to increase as sets end closer to failure, while the effect on maximal strength appears negligible (Robinson 2024 [B]), but direct comparisons of training to failure with stopping short of it find small differences when volume is similar (Grgic 2022; Refalo 2023 [B]). The plan therefore ends most sets 1–2 reps short of failure from week 6 and keeps true failure for the last set of safe isolation exercises.

People tend to underestimate how many reps they have left. Estimates improve with training experience and are more accurate close to failure (Steele 2017; Halperin 2022 [B]). In the pooled data the average underestimate was about one rep, but individuals varied (Halperin 2022), so a beginner's "2 in reserve" can be 3–4 or more [D]. That is why calibration matters.

Calibrate from week 4, then every 2–3 weeks. Pick one or two low-risk machine or cable exercises in the session, such as the leg press, leg extension, pulldown, cable row or lateral raise. On the last set, note your RIR estimate at the point where you would normally stop, then keep going to technical failure and count the extra reps. If you managed 3 or more reps beyond your estimate, you have been stopping too early and should push those sets harder from now on; if you managed 2, push a little harder and recheck at the next calibration; if you were within about 1 rep, your judgement is good; and if you got fewer reps than you estimated, you have been closer to failure than you thought, so ease off by about a rep. Never calibrate on barbell squats, bench presses or deadlifts.

### 7.4 Progression: double progression

Each exercise has a rep range. Keep the load the same until every set reaches the top of the range at the target RIR, then add the smallest load step available.

| Equipment | Typical step |
|---|---|
| Barbell, upper-body lifts | +2.5 kg |
| Barbell, lower-body lifts | +5 kg |
| Dumbbells | Next pair up (usually +1–2 kg per dumbbell) |
| Machines and cables | One plate on the stack, or an add-on plate if available |

At the loads beginners usually lift, these steps are roughly 4–8% for barbell lifts (2.5 kg is 5% of a 50 kg bench press; 5 kg is about 8% of a 65 kg squat), shrinking as you get stronger, and they can be 10% or more for light dumbbells and some machines. If an increase drops your first set below the bottom of the range, go back to the previous load and extend the range by 3–5 reps (for example, up to 15) before trying the jump again. Progressing reps and progressing load produced similar muscle growth in a direct comparison (Plotkin 2022 [C]). Keeping progression this simple costs little: in volume-matched comparisons, periodised programmes did not produce more muscle growth than non-periodised ones, though periodisation may favour strength gains (Moesgaard 2022 [B]).

Example: dumbbell bench press, 3 × 8–12, starting with 20 kg dumbbells.

| Session | Load | Reps | Decision |
|---|---|---|---|
| 1 | 20 kg | 12, 11, 10 | Keep the load |
| 2 | 20 kg | 12, 12, 11 | Keep the load |
| 3 | 20 kg | 12, 12, 12 | Move to 22 kg next time |
| 4 | 22 kg | 10, 9, 8 | New baseline; build the reps again |

### 7.5 Rest between sets

Rest 2–3 min on compound lifts and 60–90 s on isolation lifts. In a Bayesian meta-analysis, rest periods longer than about 60 s gave slightly more growth than shorter ones, with no appreciable further benefit beyond about 90 s (Singer 2024 [B]). One trial in trained men found that 3-min rests produced more growth than 1-min rests (Schoenfeld 2016b [C]). Supersetting muscles that don't compete, such as biceps and triceps, saves time without an obvious cost (Iversen 2021 [C]).

### 7.6 Tempo and range of motion

Lift with intent, lower over about 2–3 s, and don't bounce. Repetition durations from about 0.5 to 8 s produce similar growth; very slow reps (over about 10 s) appear inferior, although few studies tested them (Schoenfeld 2015 [B]).

Use the full range you can control, with emphasis on the position where the muscle is stretched. Several small trials found as much or more growth when a muscle was trained at long lengths: seated rather than lying leg curls for the hamstrings (Maeo 2021), overhead rather than arms-down triceps extensions (Maeo 2023), partial reps in the stretched part of the range on the leg extension (Pedrosa 2022) and the calf raise (Kassiano 2023), and deep rather than half squats for the glutes and adductors (Kubo 2019) [B–C]. A meta-analysis found full range of motion at least as good as partial range overall, with partials at long muscle lengths possibly comparable (Wolf 2023 [B]). These results come from a handful of muscles, so use the principle to choose between otherwise similar exercises. On the last set of leg extensions and calf raises, once you cannot complete another full rep, you may add 3–5 partial reps in the stretched half of the movement [D].

### 7.7 Technique help

For the barbell squat, Romanian deadlift, trap-bar deadlift and bench press, one or two sessions with a qualified coach in the first month are worth the cost. Filming your sets from the side and comparing them with good examples is a free alternative [D].

### 7.8 When progress stalls

| Situation | Action |
|---|---|
| One lift stalls for 2 sessions in a row | Check your effort, sleep and food first; then reduce the load by 5–10% and build back up, or switch to a close variation |
| Several lifts stall and you feel run-down | Take a lighter week (half the sets at RIR 3–4), then resume |
| Soreness keeps lasting into the next session for that muscle | Remove 1–2 sets per session for that muscle for 2 weeks |

There is no scheduled deload before week 13, because a beginner usually tolerates 12 weeks of a plan like this [D] and week 13 is already a lighter week. In a Delphi consensus, coaches most often described deloading every 4–8 weeks, which reflects practice rather than trial evidence (Bell 2023 [D]). A one-week break part-way through a supervised programme did not appear to reduce muscle growth compared with training straight through, though continuous training may have favoured strength gains (Coleman 2024 [C]), so taking a lighter week when the stall rules call for it costs little.

### 7.9 Soreness and pain

Delayed-onset muscle soreness peaks 1–3 days after unfamiliar training and shrinks as you repeat the same work. It is a poor indicator of whether a session worked (Schoenfeld & Contreras 2013 [C]). The pain rules below are conventional practice [D].

| Situation | What to do |
|---|---|
| Mild discomfort, up to about 3 out of 10, that has settled by the next morning | Carry on |
| Sharp pain, pain in a joint rather than in the muscle, or pain that is worse the next day | Change the exercise (6.7) |
| Pain lasting more than 2 weeks, swelling, numbness or tingling, or a joint that gives way | See a physiotherapist or doctor |

## 8. Cardiovascular training

### 8.1 What the evidence says

| Finding | Source | Grade |
|---|---|---|
| Interference with muscle growth from concurrent cardio increases with cardio frequency and session duration, and appears larger with running than cycling | Wilson 2012 | B; C for running versus cycling, which rests on a subgroup comparison |
| In an updated meta-analysis, adding cardio did not reduce whole-muscle hypertrophy or maximal strength gains; explosive strength gains were blunted, mainly when both were done in the same session | Schumann 2022 | B |
| Measured in individual muscle fibres, concurrent training attenuated type I fibre hypertrophy, apparently more with running than cycling | Lundberg 2022 | B–C |
| When both are done in one session, lifting first favours lower-body strength gains; order made no clear difference to hypertrophy | Murlasits 2018 | B |
| High-intensity intervals improve VO2max at least as much as continuous training, and more in some trials | Milanović 2015; Helgerud 2007 | A–B |

Read together, these findings suggest that a moderate cardio dose, mostly easy, mostly on a bike or another low-impact machine, and kept away from leg sessions, is unlikely to cost you much muscle growth while it improves your fitness. The remaining uncertainty is mainly about the fibre-level findings and about doses higher than this plan uses.

### 8.2 Intensity zones

Estimated maximum heart rate (HRmax) = 208 − 0.7 × age = 208 − 21 ≈ 187 bpm (Tanaka 2001). Your true maximum can differ from this estimate by 10 bpm or more, so the talk test, perceived effort and heart-rate numbers are all approximate; use whichever you find most consistent (Reed & Pipe 2014 [C]).

| Zone | Talk test | Effort (RPE 0–10) | % of estimated HRmax | Heart rate if the estimate is right |
|---|---|---|---|---|
| Easy ("zone 2") | You can speak in full sentences | 3–4 | 65–75% | About 120–140 bpm |
| Moderate to hard | Short phrases only | 5–7 | 80–88% | About 150–165 bpm |
| Interval (hard) | A few words at most | 8–9 | 88–95% | About 165–178 bpm, usually reached late in each interval |

"Zone 2" has several competing definitions, based on heart rate, blood lactate or breathing thresholds, and claims that it is uniquely good for mitochondria go beyond the human evidence [C]. In this plan "easy" means conversational effort. That effort falls inside the moderate-intensity band of the ACSM classification, 64–76% of HRmax (Garber 2011), so it counts toward physical-activity guidelines.

### 8.3 Week-by-week plan

| Weeks | Easy cardio | Interval session (Saturday) | Weekly total, approx. |
|---|---|---|---|
| 1–2 | Tuesday and Saturday, 30 min each | None | 60 min easy |
| 3–4 | Tuesday and Saturday, 35–40 min each; optionally 4–6 brisk 20 s pick-ups late in one session | None; in week 4 the Saturday session is replaced by the aerobic benchmark test | 70–80 min easy |
| 5 | Wednesday 40 min; Monday 20 min after Upper A | 4 × 90 s hard, 2 min easy between | About 60 min easy plus 6 min hard |
| 6 | Wednesday 40 min; Monday 20 min after Upper A | 5 × 2 min hard, 2 min easy between | About 60 min easy plus 10 min hard |
| 7–8 | Wednesday 45 min; Monday 20–25 min | 4 × 3 min hard, 3 min easy between | About 65–70 min easy plus 12 min hard |
| 9–12 | Wednesday 45–60 min; Monday 25–30 min | 4 × 4 min hard, 3 min easy between | About 70–90 min easy plus 16 min hard |
| 13 | 1–2 sessions of 30–40 min, including the submaximal test | Aerobic benchmark retest | – |

The 4 × 4 min format comes from Helgerud 2007, where it was done three times a week for 8 weeks. Once a week is a smaller dose, so expect smaller gains than in that trial [C].

From week 9, the planned sessions add up to roughly 125–150 moderate-intensity-equivalent minutes a week, counting the interval session's warm-up and recoveries and counting hard minutes double. Brisk walking adds more, which brings you to the World Health Organization guideline of 150–300 min of moderate activity a week (or an equivalent mix with vigorous activity), alongside muscle strengthening on 2 or more days (Bull 2020).

### 8.4 The interval session

| Part | Duration | Effort |
|---|---|---|
| Warm-up | 10 min | Easy, building to moderate in the last 2–3 min |
| Hard intervals | As in 8.3 for that week | 8–9 out of 10 by the end of each interval; heart rate lags behind effort and may reach the target range only in the second half |
| Recoveries | As in 8.3 | Easy; keep moving |
| Cool-down | 5–10 min | Easy |

Use a bike, rower, incline treadmill or elliptical. If you cannot finish the last interval at the intended effort, lower the hard pace next time and keep the number of intervals.

### 8.5 Choosing the type of cardio

The bike, rower, incline walking and the elliptical are the default choices. Cycling appeared to interfere less than running with muscle growth in the meta-analyses above, while rowing, elliptical and incline walking have been studied less (Wilson 2012; Lundberg 2022 [C]). After Upper A, use the bike or incline walking, since rowing works the back and arms you have just trained. Running is fine if you enjoy it: build it up with run-walk intervals, keep hard runs away from the day before a lower-body session, and increase weekly running time gradually [D]. A sport such as football, badminton or swimming can replace an easy session. Football and court sports include sprints and sharp changes of direction, so schedule them like hard sessions under the 24-hour rule in 5.5; in weeks 5–12 that makes Wednesday the natural slot [D].

### 8.6 Daily steps and sitting

Add about 1,000 steps a day every 2 weeks until you reach 8,000–10,000; if you start at around 4,000–6,000, that will be by about week 8. In a meta-analysis of 15 cohorts, mortality risk fell as daily steps rose, levelling off at around 8,000–10,000 steps a day in adults under 60 (Paluch 2022 [C]); the data are observational, so they show an association, not proof of cause. On desk days, get up and move for a few minutes every 30–60 min. In a laboratory study of overweight and obese adults, breaking up sitting with 2-min walks every 20 min lowered blood glucose and insulin after meals (Dunstan 2012 [C]); the 30–60 min interval above is a looser, practical version of that [D].

## 9. Mobility and flexibility

### 9.1 What the evidence says

Full-range resistance training improved range of motion about as much as stretching did in a meta-analysis (Afonso 2021) and in an earlier trial (Morton 2011) [B], so your lifting is part of your mobility work. For stretching itself, at least about 5 min per muscle group per week appears to be the threshold for meaningful gains in range of motion (Thomas 2018 [B]). Sitting posture has not been established as a cause of low back pain (Swain 2020 [C]), so the routine targets the range of motion that your lifts and daily life use.

### 9.2 The routine (12–15 min, 4–5 days a week)

Stretch to a strong but tolerable sensation, about 5–7 out of 10, breathe slowly, and relax into each hold. Do the routine after cardio sessions, on rest days or after lifting.

| # | Drill | Dose | Main target |
|---|---|---|---|
| 1 | Half-kneeling hip-flexor stretch, progressing to the couch stretch | 2 × 30–45 s per side | Hip flexors and quads |
| 2 | Lying hamstring stretch with a strap | 2 × 30–45 s per side | Hamstrings |
| 3 | Doorway pec stretch | 2 × 30–45 s per side | Chest and front of the shoulder |
| 4 | Knee-to-wall ankle rocks | 2 × 10 per side | Ankle dorsiflexion, which affects squat depth |
| 5 | 90/90 hip switches | 2 × 6–8 per side | Hip rotation |
| 6 | Quadruped thoracic rotation or open book | 2 × 8 per side | Upper-back rotation |
| 7 | Back-to-wall overhead reach or wall slide | 2 × 8 | Overhead shoulder range |
| 8 | Supported deep-squat hold (holding a post or rack) | 2 × 30–60 s | Hips, ankles and the bottom of the squat |
| 9 | Dead hang from a bar | 2 × 20–40 s | Shoulders and grip; easiest to do at the gym |

Done 5 days a week, or 4 days with the 45 s holds, items 1–3 give each of those muscle groups roughly 5–7.5 min of stretching a week. For busy days, a short version of about 6 min is one 45 s hold per side for items 1–3, then item 8.

### 9.3 Mobility tests (weeks 1 and 13)

| Test | How | Record |
|---|---|---|
| Knee-to-wall | Barefoot, facing a wall; keep the heel down and touch the knee to the wall, moving the foot back until you only just can | Distance from big toe to wall in cm, each side |
| Toe touch | Stand with straight knees and reach down (or use a sit-and-reach box) | Distance in cm from fingertips to floor (or the box reading) |
| Overhead reach | Back, head and buttocks against a wall, knees slightly bent, lower back flat; raise straight arms overhead | Whether your thumbs reach the wall without the lower back arching; if not, the gap in cm |
| Deep squat | Feet about shoulder width; squat as deep as you can and hold for 30 s | Whether the heels stay down (yes or no) |

Compare your results with your own baseline. Published norms for these tests vary, and your direction of change is what this plan uses [D].

## 10. Nutrition

### 10.1 Calories: estimate, then calibrate

Resting energy expenditure from the Mifflin-St Jeor equation is 10 × 75 + 6.25 × 180 − 5 × 30 + 5 ≈ 1,730 kcal/day (Mifflin 1990). Multiplying by an activity factor of 1.45–1.6 for a desk job plus this training gives about 2,500–2,750 kcal/day [D]. Start near 2,600.

Prediction equations can miss by more than 10% for individuals (Frankenfield 2005 [B]), so treat 2,600 as a starting guess and calibrate it. Weigh yourself every morning after using the toilet and before eating or drinking, and work with the weekly average. For weeks 1–3, log your food roughly; an app is fine, and consistency matters more than precision. If the weekly average stays within about ±0.2 kg, your logged intake is close to maintenance. Each 0.25 kg a week of sustained change corresponds very roughly to 250–300 kcal/day above or below maintenance [D]. Expect a rise of 0.5–1.5 kg in the first 1–2 weeks from glycogen and water, more if you start creatine, and don't cut calories in response to it. If you start creatine during weeks 1–3, its water-weight gain will make the calibration less reliable. Without a loading phase, muscle creatine stores fill over about 3–4 weeks (Hultman 1996 [C]) and the water gain probably follows the same course, so either judge your calorie target from the weight trend after week 4, or begin creatine after the calibration period.

### 10.2 Default for weeks 1–12: maintenance with recomposition

With an estimated 15–18% body fat and almost no training history, you are in a group where gaining muscle at maintenance calories has been reported, provided protein is adequate (Barakat 2020 [C]). In young overweight men, even a large energy deficit combined with high protein and intense training produced lean-mass gains over 4 weeks (Longland 2016 [C]). Across trials, though, a deficit of roughly 500 kcal/day or more tended to cancel the lean-mass gains from training (Murphy & Koehler 2022 [B]). In trained lifters, a larger surplus (15% versus 5% above maintenance) mainly added more fat (Helms 2023 [C]).

Success at maintenance means body weight stable or rising slowly (up to about 0.1–0.2 kg a week), waist stable or falling, and loads rising.

### 10.3 The week-13 decision

Measure your waist at the navel as described in 12.1.

| Your situation at week 13 | Next phase | Target rate | Notes |
|---|---|---|---|
| Waist-to-height ratio of 0.50 or higher (a waist of 90 cm or more at your height), or you want to be leaner | Fat loss: 10–20% below maintenance | About 0.5% of body weight a week (about 0.35–0.4 kg) | Raise protein toward 2.2 g/kg; keep the training volume |
| Happy with your leanness and wanting more size | Lean gain: 5–10% above maintenance (about 150–250 kcal/day) | About 0.25% of body weight a week (about 0.2 kg) | Shrink the surplus if your waist rises steadily for a month or more |
| In between | Stay at maintenance | Weight stable | Recomposition continues, more slowly |

Waist-to-height ratio is a screening marker for cardiometabolic risk, with 0.5 a common boundary (Ashwell 2012 [C]). It is used here only as a simple decision threshold; it says nothing about how you look. The 0.25–0.5% per week range for gaining comes from recommendations for physique athletes (Iraki 2019 [D]), and the lower end fits your goal of staying lean and not bulky.

### 10.4 Macronutrients (at about 2,600 kcal)

| Nutrient | Daily target | Rationale |
|---|---|---|
| Protein | 1.6–2.2 g/kg (120–165 g; aim for 140–160 g) | Gains in fat-free mass from extra protein level off around 1.6 g/kg/day, with the upper confidence limit near 2.2 (Morton 2018 [A]); a later meta-analysis reached a similar conclusion (Nunes 2022); higher intakes may help more during a deficit (Helms 2014 [C]) |
| Fat | About 0.8–1.2 g/kg (60–90 g) | Convention that leaves room for food variety and fat-soluble vitamins [D] |
| Carbohydrate | The remainder, roughly 280–380 g (about 3.7–5 g/kg) | Fuels training; the exact amount matters less than total calories and protein [D] |
| Fibre | 30–40 g | From whole grains, legumes, fruit and vegetables [D] |

Spread protein over 3–5 meals of roughly 0.4 g/kg (30–40 g) each. When total daily protein is matched, timing relative to training makes little difference (Schoenfeld 2013 [B]), and a large single dose is not wasted (Trommelen 2023 [C]), so the meal pattern is about convenience and appetite. A meal with protein and carbohydrate 1–3 h before training and another within a few hours after is a sensible default [D]. In healthy adults, higher protein intakes did not worsen kidney function in a meta-analysis (Devries 2018 [B]).

That protein total sits near the top of your range; trim the chicken or yoghurt a little if you prefer to sit lower. To hit your calibrated calorie target, adjust the rice, rotis, potatoes and oil, and keep the protein foods.

### 10.7 Other nutrition points

Eat fatty fish once or twice a week and fruit and vegetables daily [D]. Keep alcohol low, especially on training days: in a laboratory study, a large dose of about 1.5 g/kg after training (for you, roughly 8 US standard drinks) reduced myofibrillar protein synthesis by about a quarter to a third, with the magnitude depending on macronutrient co-ingestion (Parr 2014 [C]). Drink to thirst; pale-yellow urine is a reasonable everyday check [D].

### 10.8 Supplements

| Supplement | How to use it | Evidence | Notes |
|---|---|---|---|
| Creatine monohydrate | 3–5 g a day at any time; no loading phase needed | A for strength and lean mass; B for a small effect on directly measured muscle growth (Kreider 2017; Burke 2023) | Adds about 0.5–1.5 kg of water weight in the first weeks. Raises blood creatinine, which can be misread as reduced kidney function, so mention it before blood tests. A single 2009 study reported a rise in DHT; it measured no hair outcomes and has not been replicated (van der Merwe 2009; Antonio 2021) |
| Caffeine | Optional: about 3 mg/kg (about 200–225 mg) 45–60 min before training | A for performance (Guest 2021) | Keep it well away from bedtime: in a laboratory study, 400 mg taken 6 h before bed still disrupted sleep (Drake 2013 [C]), and a meta-analysis estimated that avoiding any loss of total sleep time takes about 9 h between a 100 mg coffee and bed and about 13 h for a dose near 220 mg (Gardiner 2023 [C]; these cut-offs are model estimates, and sensitivity varies between people). For evening sessions, skip it or use a much smaller dose [D] |
| Whey protein | Only for convenience when food falls short of your protein target | B: it counts as protein, with no special effect beyond that | Choose a third-party-tested product (10.9) |
| Vitamin D | Only if a blood test shows you are low | C | Dose as advised by your doctor |
| BCAAs, "testosterone boosters", fat burners | Not recommended | C–D | No useful effect when protein intake is adequate, or a poor safety and contamination record |

### 10.9 Staying drug-free: contamination risk

In an international analysis of 634 non-hormonal supplements, about 15% contained anabolic-steroid precursors that were not declared on the label (Geyer 2004 [C]). Those data are old and the current rate is unknown. Buy supplements certified by a third-party testing programme such as Informed Sport or NSF Certified for Sport, and avoid anything sold as a "test booster" or "prohormone".

## 11. Sleep and stress

Aim for at least 7 h of sleep a night, the minimum for adults in a joint consensus statement (Watson 2015 [D]). Sleep's direct effect on muscle growth is under-studied, but one night without sleep reduced postprandial muscle protein synthesis by about 18% in young adults (Lamon 2021 [C]). Keep your wake-up time consistent within about an hour, including at weekends, keep the bedroom dark, cool and quiet, and follow the caffeine cut-off in 10.8 [D].

Life stress affects training too. Students reporting high life stress gained less strength over 12 weeks of training than students reporting low stress (Bartholomew 2008 [C]). In heavy weeks, hold your loads steady, keep sessions short, and aim to train without trying to progress [D]. If you are ill with a fever or chest symptoms, rest until they have gone [D].

## 12. Monitoring and decision rules

### 12.1 What to measure and when

| Measure | How | When |
|---|---|---|
| Body weight | Morning, after the toilet, before eating or drinking; use the 7-day average | Daily |
| Waist | Tape level at the navel, relaxed, after a normal breath out, under the same conditions each time | Every 2 weeks (weeks 1, 3, 5, 7, 9, 11, 13) |
| Shoulder and upper-arm circumference (optional) | Shoulders at the widest point; relaxed arm at mid-upper-arm | Every 4 weeks |
| Photos | Front, side and back; same light, time of day, distance and pose; relaxed and flexed | Weeks 1, 4, 8, 13 |
| Training log | Every working set: load, reps, estimated RIR (Appendix A) | Every session |
| Strength (e1RM) | From logged sets with the Epley formula, load × (1 + reps/30), using sets of 10 reps or fewer, with your estimated RIR added to the reps (see below); compared with measured 1RMs in LeSuer 1997 [C] | Weeks 4, 8, 12 |
| Submaximal aerobic test | 10 min at a fixed workload; average heart rate over the last 2 min (12.2) | Weeks 1, 5, 9, 13 |
| Aerobic benchmark | One maximal test of your choice (12.2) | Weeks 4 and 13 |
| Resting heart rate | On waking, before getting up, on 3 mornings in a row; use the average | Weeks 1, 8, 13 |
| Mobility tests | As in 9.3 | Weeks 1 and 13 |

For strength, track the lifts that appear in both phases: incline dumbbell press, lat pulldown, seated cable row, leg press and trap-bar deadlift. Add barbell bench press and back squat from week 5, with the first check in week 8. Because your sets stop short of failure, add your estimated RIR to the reps before using the formula (8 reps at RIR 2 counts as 10), and compare sets done at similar RIR. Without that step, part of any rise from week 4 to week 8 could come from the lower RIR targets of weeks 6–8 rather than from strength gain; the RIR estimates still add their own error (7.3) [D]. For sets of more than 10 reps, compare load × reps at similar RIR instead of converting to e1RM. In LeSuer 1997 the Epley formula was tested on barbell squat, bench press and deadlift; treat machine and cable e1RM estimates as rougher approximations.

Shoulder circumference divided by waist circumference is a personal index for tracking your shape; there is no validated target value for it [D].

### 12.2 How to run the aerobic tests

The submaximal test (weeks 1, 5, 9 and 13) goes at the start of an easy session, on the same machine and settings each time: for example, a treadmill at 6 km/h and 6% incline, or a bike at a fixed wattage that feels easy, such as 80–120 W. Test at the same time of day, with no caffeine in the previous 4 h, and not on the day after a hard leg session. Go for 10 min continuously and note the average heart rate over minutes 8–10. A falling heart rate at the same workload means your fitness is improving. Single readings vary by several beats per minute from day to day, so look for a consistent trend [D].

For the aerobic benchmark (weeks 4 and 13), pick one test, ideally the one matching the cardio type you use most, and keep it for both dates. The Cooper test is a 12-min run for maximum distance; estimated VO2max in ml/kg/min ≈ (distance in m − 504.9) ÷ 44.73 (Cooper 1968 [C]), so 2,400 m gives about 42. The alternatives are a 2,000 m row for time or a 20-min all-out bike effort for average power. The first benchmark falls in week 4 so that your first maximal effort comes after three weeks of easy cardio. Part of a beginner's improvement on a maximal test is better pacing, so compare like with like and don't read much into small changes [D].

### 12.3 Decision rules

Act on trends that last at least 2 weeks, not on single readings. Because the waist is measured only every 2 weeks, count it as rising only when two measurements in a row both sit above your earlier reading [D].

| Signal lasting 2 weeks or more | Response |
|---|---|
| Weight rising more than about 0.25% a week (about 0.2 kg) in weeks 1–12, or more than 0.5% a week in a later gaining phase, and waist rising | Reduce intake by 150–250 kcal/day |
| Weight falling more than 0.5% a week without intending to | Increase intake by 200–300 kcal/day |
| Weight stable, waist falling, loads rising | No change |
| Most lifts stalled | Check sleep and food, then take a lighter week (7.8) |
| Joint pain | Substitute the exercise (6.7); get it assessed if it lasts more than 2 weeks |
| Submaximal heart rate not improving by the week-9 test | Make sure the easy sessions actually happen; add 10 min to each |
| A muscle visibly lagging at week 13 | Add 2–4 weekly sets for it in the next block (13.2) |

## 13. Week 13 and what comes next

### 13.1 Week 13

Do all four upper/lower sessions (three if the week is busy) with about half the sets at RIR 3–4. Run the retests: the submaximal and benchmark aerobic tests, resting heart rate, the mobility tests, photos and waist. Use your week-12 log for the final e1RM figures, and make the nutrition decision in 10.3.

### 13.2 The next block (weeks 14–25)

Keep the upper/lower structure and change about one exercise per muscle group, keeping the ones that are still progressing. Varying exercises may produce more even growth across a muscle's regions, although the evidence is limited (Fonseca 2014; Kassiano 2022 [C]). Add 2–4 weekly sets for the muscles you most want to improve, staying within about 10–20 sets per muscle per week, since each extra set adds less at higher volumes (Pelland 2026 [B]). A fifth lifting session is optional, because frequency matters little once weekly sets are matched (Schoenfeld 2019; Ramos-Campo 2024 [B]).

Keep the cardio and mobility work. If aerobic fitness becomes a higher priority, lengthen the Wednesday session to 60 min or more, or add a second interval session on a day that is not followed by a lower-body session. When you are happy with your size, move to maintenance calories and about half your sets. In a 32-week trial, one-ninth of the original volume was enough for young adults to keep their muscle-fibre gains (Bickel 2011 [C]), so half your sets leaves a wide margin.
